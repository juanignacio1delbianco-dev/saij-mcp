[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saij-mcp"
version = "0.1.1"
description = "Servidor MCP para buscar en SAIJ (Sistema Argentino de Información Jurídica) — fallos, legislación, sumarios y doctrina"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Hernán Carlos Caravario", email = "hernan@caravario.ar" },
]
keywords = ["mcp", "legal", "argentina", "saij", "jurisprudencia", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
saij-mcp = "saij_mcp.server:main"

[project.urls]
Homepage = "https://github.com/hernan-cc/saij-mcp"
Repository = "https://github.com/hernan-cc/saij-mcp"
Issues = "https://github.com/hernan-cc/saij-mcp/issues"
